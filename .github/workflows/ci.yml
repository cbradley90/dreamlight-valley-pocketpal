name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Netlify handles deploys via its own GitHub app; this workflow only verifies.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate task data
        run: npm run validate:data

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the built app
        run: npm run test:smoke

      - name: Check build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          for i in 0 1 2 3 4 5; do
            test -f "dist/tree/stage-$i.jpg" || { echo "::error::dist/tree/stage-$i.jpg missing"; exit 1; }
          done
          if grep -rq "window\.storage" dist/; then
            echo "::error::window.storage found in build output — that API only exists inside a Claude artifact and will break saving on the live site"
            exit 1
          fi
          echo "Build output looks good."
